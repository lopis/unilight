<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gem Weaver DASH - Map Maker</title>
  <style>
    :root {
      --red: #e33f3f;
      --red2: #b80505;
      --yellow: #fad354;
      --yellow2: #e9a33a;
      --orange: #df6807;
      --orange2: #a13c05;
      --green: #74bc57;
      --green2: #477c31;
      --cyan: #64c1dd;
      --cyan2: #35b7de;
      --blue: #2f52c6;
      --blue2: #1a2e70;
      --magenta: #f39be6;
      --magenta2: #da5dc7;
      --magenta3: #a42d92;
      --black: #131217;
      --white: #f9f9f9;

      --ink: var(--white);
      --line: #00000033;
      --panel: #0000002f;
      --cell: #ffffffec;
      --cell-hover: #fffffff8;
      --selected: var(--yellow);
      --warn: #ffd0d0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      color: var(--ink);
      font-family: "Trebuchet MS", "Gill Sans", "Verdana", sans-serif;
      background: var(--magenta3);
    }

    body {
      display: flex;
      flex-direction: column;
      max-width: 980px;
      margin: auto;
      position: relative;
      padding: 1rem;
      user-select: none;
    }

    main {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 1rem;
      align-items: start;
      flex: 1;
      min-height: 0;
    }

    .panel {
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: 16px;
      box-shadow:
        inset 0 1px 0 #ffffff40,
        0 0.4rem 0 0 #0000002b;
    }

    .board-wrap {
      padding: 1rem;
    }

    h1 {
      margin: 0 0 0.65rem;
      font-size: 1.35rem;
      line-height: 1.2;
      letter-spacing: 0.02em;
      text-align: center;
      color: var(--white);
      text-shadow: 0 2px 0 #00000040;
    }

    .sub {
      margin: 0 0 1rem;
      font-size: 0.92rem;
      opacity: 0.92;
      color: #f8e8ff;
      text-align: center;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(10, 1fr);
      width: min(100%, 620px);
      aspect-ratio: 1 / 1;
      border: 2px solid var(--line);
      border-radius: 10px;
      overflow: clip;
      background: var(--magenta2);
      margin: 0 auto;
    }

    .cell {
      border: 1px solid #0000002b;
      padding: 0;
      min-width: 0;
      min-height: 0;
      background: var(--cell);
      display: grid;
      place-items: center;
      font-size: clamp(1rem, 2.6vw, 1.55rem);
      line-height: 1;
      cursor: pointer;
      transition: background-color 120ms ease, transform 90ms ease;
      user-select: none;
    }

    .cell:hover {
      background: var(--cell-hover);
      z-index: 1;
    }

    .controls {
      padding: 0.9rem;
      display: grid;
      gap: 0.8rem;
    }

    .label {
      font-size: 0.86rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      opacity: 0.95;
      margin-bottom: 0.35rem;
      color: #ebffe8;
    }

    .palette {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0.45rem;
    }

    .tool {
      border: none;
      border-radius: 14px;
      width: 100%;
      aspect-ratio: 1 / 1;
      padding: 0;
      background: white;
      box-shadow: 0 0.26rem 0 0 #ccc;
      color: #000000d0;
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 90ms ease, box-shadow 90ms ease;
    }

    .tool.selected {
      box-shadow: 0 0.12rem 0 0 var(--cyan2);
      transform: translateY(0.14rem);
      outline: 2px solid var(--selected);
    }

    .tool .token {
      font-size: 0.52rem;
      letter-spacing: 0.03em;
      font-weight: 800;
      text-shadow: 0 1px 0 #ffffff80;
      margin-top: -0.2rem;
    }

    .row {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    button.action {
      border: none;
      color: #ffffff;
      background: var(--red);
      box-shadow: 0 0.25rem 0 0 var(--red2);
      border-radius: 12px;
      padding: 0.45rem 0.65rem;
      font-weight: 700;
      cursor: pointer;
    }

    button.action:active {
      box-shadow: 0 0.08rem 0 0 var(--red2);
      transform: translateY(0.17rem);
    }

    button.alt {
      background: var(--orange);
      color: #00000099;
      box-shadow: 0 0.25rem 0 0 var(--orange2);
    }

    button.alt:active {
      box-shadow: 0 0.08rem 0 0 var(--orange2);
      transform: translateY(0.17rem);
    }

    textarea {
      width: 100%;
      min-height: 88px;
      resize: vertical;
      border: 1px solid #00000030;
      border-radius: 8px;
      padding: 0.55rem;
      font-family: "Courier New", monospace;
      font-size: 0.82rem;
      background: #ffffffea;
      color: #13261b;
    }

    .note {
      font-size: 0.82rem;
      opacity: 0.9;
    }

    .inventory-bits {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 0.35rem;
    }

    .gem-bit {
      border: none;
      border-radius: 10px;
      background: var(--white);
      color: var(--black);
      padding: 0.25rem 0.2rem;
      display: grid;
      place-items: center;
      gap: 0.1rem;
      cursor: pointer;
      box-shadow: 0 0.2rem 0 0 #00000022;
      font-size: 0.95rem;
      line-height: 1;
    }

    .gem-bit.selected {
      background: var(--yellow);
      box-shadow: 0 0.1rem 0 0 var(--orange2);
      transform: translateY(0.1rem);
    }

    .gem-bit-token {
      font-size: 0.56rem;
      font-weight: 800;
      opacity: 0.85;
    }

    .error {
      color: var(--warn);
      min-height: 1.2em;
      font-size: 0.83rem;
      font-weight: 700;
    }

    code {
      background: #ffffff2e;
      border: 1px solid #ffffff35;
      border-radius: 6px;
      padding: 0.06rem 0.3rem;
      font-size: 0.8rem;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="panel board-wrap">
      <h1>Gem Weaver DASH Map Maker</h1>
      <div id="grid" role="grid" aria-label="10 by 10 map grid"></div>
    </section>

    <aside class="panel controls">
      <div>
        <div class="label">Palette</div>
        <div id="palette" class="palette"></div>
      </div>

      <div>
        <div class="label">Actions</div>
        <div class="row">
          <button id="clearBtn" class="action alt" type="button">Clear Map</button>
          <button id="fillBtn" class="action alt" type="button">Fill Empty</button>
        </div>
      </div>

      <div>
        <div class="label">Initial Inventory</div>
        <div id="initialInventory" class="inventory-bits"></div>
      </div>

      <div>
        <div class="label">Compact String</div>
        <textarea id="encoded" placeholder="Encoded map appears here"></textarea>
        <div class="row" style="margin-top: 0.4rem;">
          <button id="encodeBtn" class="action" type="button">Encode</button>
          <button id="decodeBtn" class="action" type="button">Decode</button>
          <button id="copyBtn" class="action alt" type="button">Copy</button>
        </div>
      </div>

      <div id="error" class="error"></div>
    </aside>
  </main>

  <script>
    const WIDTH = 10;
    const HEIGHT = 10;
    const CELL_COUNT = WIDTH * HEIGHT;
    const MAP_VERSION_BITS_PER_CELL = 5;
    const LEGACY_BITS_PER_CELL = 4;

    const ITEMS = [
      ["FR", "🍓"],
      ["FO", "🍊"],
      ["FY", "🍌"],
      ["FG", "🥝"],
      ["FC", "💧"],
      ["FB", "🫐"],
      ["FV", "🍇"],
      ["GR", "❤️"],
      ["GO", "🧡"],
      ["GY", "💛"],
      ["GG", "💚"],
      ["GC", "🩵"],
      ["GB", "💙"],
      ["GV", "💜"],
      ["GK", "🖤"],
      ["GW", "🤍"],
      ["HD", "🟩"],
      ["HN", "👉"],
      ["HL", "🌊"],
      ["HG", "🌱"],
    ];
    const UNICORN = ["UN", "🦄"];
    const ELEMENTS = [UNICORN, ...ITEMS];
    const BITS_PER_CELL = Math.max(4, Math.ceil(Math.log2(ELEMENTS.length + 1)));
    const RAINBOW_GEMS = [
      ["GR", "❤️"],
      ["GO", "🧡"],
      ["GY", "💛"],
      ["GG", "💚"],
      ["GC", "🩵"],
      ["GB", "💙"],
      ["GV", "💜"],
    ];

    const TOOL_EMPTY = { kind: "empty", label: "Empty", emoji: "·", token: "--" };
    const TOOL_ITEMS = ELEMENTS.map(([token, emoji], i) => ({
      kind: "item",
      itemCode: i + 1,
      emoji,
      token,
      label: `${token} ${emoji}`,
    }));
    const TOOLS = [TOOL_EMPTY, ...TOOL_ITEMS];

    const gridEl = document.getElementById("grid");
    const paletteEl = document.getElementById("palette");
    const initialInventoryEl = document.getElementById("initialInventory");
    const encodedEl = document.getElementById("encoded");
    const errorEl = document.getElementById("error");

    const encodeBtn = document.getElementById("encodeBtn");
    const decodeBtn = document.getElementById("decodeBtn");
    const copyBtn = document.getElementById("copyBtn");
    const clearBtn = document.getElementById("clearBtn");
    const fillBtn = document.getElementById("fillBtn");

    const itemGrid = new Uint8Array(CELL_COUNT);
    const initialInventoryBits = new Uint8Array(RAINBOW_GEMS.length);
    let selectedTool = TOOL_ITEMS[0];
    let isMouseDown = false;
    let activeMouseButton = -1;

    function getInitialInventoryMask() {
      let mask = 0;
      for (let i = 0; i < initialInventoryBits.length; i += 1) {
        if (initialInventoryBits[i]) {
          mask |= 1 << i;
        }
      }
      return mask;
    }

    function setInitialInventoryFromMask(mask) {
      for (let i = 0; i < initialInventoryBits.length; i += 1) {
        initialInventoryBits[i] = (mask >> i) & 1;
      }
      renderInitialInventoryBits();
    }

    function renderInitialInventoryBits() {
      if (!initialInventoryEl) {
        return;
      }

      [...initialInventoryEl.children].forEach((button, index) => {
        button.classList.toggle("selected", initialInventoryBits[index] === 1);
      });
    }

    function cellIndex(x, y) {
      return y * WIDTH + x;
    }

    function cellAt(index) {
      return gridEl.children[index];
    }

    function currentCellGlyph(index) {
      const code = itemGrid[index];
      if (code === 0) {
        return "";
      }
      const entry = ELEMENTS[code - 1];
      return entry ? entry[1] : "";
    }

    function renderCell(index) {
      const cell = cellAt(index);
      if (!cell) {
        return;
      }
      cell.textContent = currentCellGlyph(index);
    }

    function renderAllCells() {
      for (let i = 0; i < CELL_COUNT; i += 1) {
        renderCell(i);
      }
    }

    function setTool(tool) {
      selectedTool = tool;
      [...paletteEl.children].forEach((btn) => {
        btn.classList.toggle("selected", btn.dataset.toolKey === toolKey(tool));
      });
    }

    function toolKey(tool) {
      if (tool.kind === "item") {
        return `item:${tool.itemCode}`;
      }
      return tool.kind;
    }

    function applyTool(index) {
      const tool = selectedTool;
      if (tool.kind === "empty") {
        itemGrid[index] = 0;
      } else if (tool.kind === "item") {
        if (tool.itemCode === 1) {
          // Keep unicorn unique by clearing any previous unicorn cell.
          for (let i = 0; i < CELL_COUNT; i += 1) {
            if (itemGrid[i] === 1) {
              itemGrid[i] = 0;
            }
          }
        }
        itemGrid[index] = tool.itemCode;
      }
      renderAllCells();
      clearError();
    }

    function clearCell(index) {
      itemGrid[index] = 0;
      renderAllCells();
      clearError();
    }

    function createGrid() {
      for (let y = 0; y < HEIGHT; y += 1) {
        for (let x = 0; x < WIDTH; x += 1) {
          const idx = cellIndex(x, y);
          const cell = document.createElement("button");
          cell.type = "button";
          cell.className = "cell";
          cell.dataset.index = String(idx);
          cell.addEventListener("mousedown", (event) => {
            if (event.button !== 0 && event.button !== 2) {
              return;
            }
            isMouseDown = true;
            activeMouseButton = event.button;
            if (event.button === 2) {
              clearCell(idx);
              return;
            }
            applyTool(idx);
          });
          cell.addEventListener("mouseenter", () => {
            if (isMouseDown) {
              if (activeMouseButton === 2) {
                clearCell(idx);
              } else {
                applyTool(idx);
              }
            }
          });
          cell.addEventListener("contextmenu", (event) => {
            event.preventDefault();
          });
          cell.addEventListener("click", () => applyTool(idx));
          gridEl.appendChild(cell);
        }
      }
      renderAllCells();
    }

    function createPalette() {
      TOOLS.forEach((tool) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tool";
        btn.dataset.toolKey = toolKey(tool);
        btn.title = tool.label;
        btn.innerHTML = `<span>${tool.emoji}</span><small class="token">${tool.token}</small>`;
        btn.addEventListener("click", () => setTool(tool));
        paletteEl.appendChild(btn);
      });
      setTool(TOOL_ITEMS[0]);
    }

    function createInitialInventorySelector() {
      if (!initialInventoryEl) {
        return;
      }

      RAINBOW_GEMS.forEach(([token, emoji], index) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "gem-bit";
        btn.title = token;
        btn.innerHTML = `<span>${emoji}</span><small class="gem-bit-token">${token}</small>`;
        btn.addEventListener("click", () => {
          initialInventoryBits[index] = initialInventoryBits[index] ? 0 : 1;
          renderInitialInventoryBits();
          clearError();
        });
        initialInventoryEl.appendChild(btn);
      });

      renderInitialInventoryBits();
    }

    document.addEventListener("mouseup", () => {
      isMouseDown = false;
      activeMouseButton = -1;
    });

    function clearError(msg = "") {
      errorEl.textContent = msg;
    }

    function pushBits(bitArray, value, bitCount) {
      for (let i = 0; i < bitCount; i += 1) {
        bitArray.push((value >> i) & 1);
      }
    }

    function bitsToBytes(bits) {
      const byteCount = Math.ceil(bits.length / 8);
      const bytes = new Uint8Array(byteCount);
      for (let i = 0; i < bits.length; i += 1) {
        if (bits[i]) {
          bytes[i >> 3] |= 1 << (i & 7);
        }
      }
      return bytes;
    }

    function bytesToBits(bytes) {
      const bits = [];
      for (let i = 0; i < bytes.length; i += 1) {
        const byte = bytes[i];
        for (let b = 0; b < 8; b += 1) {
          bits.push((byte >> b) & 1);
        }
      }
      return bits;
    }

    function readBits(bits, cursor, bitCount) {
      let value = 0;
      for (let i = 0; i < bitCount; i += 1) {
        value |= (bits[cursor.pos + i] || 0) << i;
      }
      cursor.pos += bitCount;
      return value;
    }

    function toBase64Url(bytes) {
      let binary = "";
      bytes.forEach((n) => {
        binary += String.fromCharCode(n);
      });
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }

    function fromBase64Url(str) {
      const padded = str.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((str.length + 3) % 4);
      const binary = atob(padded);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    function encodeMap() {
      const bits = [];
      for (let i = 0; i < CELL_COUNT; i += 1) {
        pushBits(bits, itemGrid[i], BITS_PER_CELL);
      }

      const mapBytes = bitsToBytes(bits);
      const bytes = new Uint8Array(mapBytes.length + 1);
      bytes[0] = getInitialInventoryMask();
      bytes.set(mapBytes, 1);
      return toBase64Url(bytes);
    }

    function parseMap(serialized, bitsPerCell, hasInventoryHeader) {
      const bytes = fromBase64Url(serialized.trim());
      const headerBytes = hasInventoryHeader ? 1 : 0;
      if (bytes.length <= headerBytes) {
        return null;
      }

      const payload = hasInventoryHeader ? bytes.subarray(1) : bytes;
      if (payload.length * 8 < CELL_COUNT * bitsPerCell) {
        return null;
      }

      const bits = bytesToBits(payload);
      const cursor = { pos: 0 };
      const decodedGrid = new Uint8Array(CELL_COUNT);

      for (let i = 0; i < CELL_COUNT; i += 1) {
        const value = readBits(bits, cursor, bitsPerCell);
        if (value > ELEMENTS.length) {
          return null;
        }
        decodedGrid[i] = value;
      }

      return {
        inventoryMask: hasInventoryHeader ? bytes[0] : 0,
        grid: decodedGrid,
      };
    }

    function decodeMap(serialized) {
      const v2 = parseMap(serialized, MAP_VERSION_BITS_PER_CELL, true);
      if (v2) {
        itemGrid.set(v2.grid);
        setInitialInventoryFromMask(v2.inventoryMask);
        renderAllCells();
        return;
      }

      const noHeaderCurrent = parseMap(serialized, BITS_PER_CELL, false);
      if (noHeaderCurrent) {
        itemGrid.set(noHeaderCurrent.grid);
        setInitialInventoryFromMask(0);
        renderAllCells();
        return;
      }

      const noHeaderLegacy = parseMap(serialized, LEGACY_BITS_PER_CELL, false);
      if (noHeaderLegacy) {
        itemGrid.set(noHeaderLegacy.grid);
        setInitialInventoryFromMask(0);
        renderAllCells();
        return;
      }

      throw new Error("Decode failed: unsupported map format");
    }

    encodeBtn.addEventListener("click", () => {
      const compact = encodeMap();
      encodedEl.value = compact;
      clearError();
    });

    decodeBtn.addEventListener("click", () => {
      try {
        decodeMap(encodedEl.value);
        clearError();
      } catch (err) {
        clearError(err instanceof Error ? err.message : "Decode failed");
      }
    });

    clearBtn.addEventListener("click", () => {
      itemGrid.fill(0);
      setInitialInventoryFromMask(0);
      renderAllCells();
      clearError();
    });

    fillBtn.addEventListener("click", () => {
      if (selectedTool.kind !== "item") {
        clearError("Select a map element before Fill Empty");
        return;
      }
      if (selectedTool.itemCode === 1) {
        clearError("Fill Empty cannot use unicorn because only one unicorn is allowed");
        return;
      }
      for (let i = 0; i < CELL_COUNT; i += 1) {
        if (itemGrid[i] === 0) {
          itemGrid[i] = selectedTool.itemCode;
        }
      }
      renderAllCells();
      clearError();
    });

    copyBtn.addEventListener("click", async () => {
      const value = encodedEl.value.trim() || encodeMap();
      encodedEl.value = value;
      try {
        await navigator.clipboard.writeText(value);
        clearError("Copied");
      } catch {
        clearError("Clipboard unavailable in this browser context");
      }
    });

    createGrid();
    createPalette();
    createInitialInventorySelector();
    encodedEl.value = encodeMap();
  </script>
</body>
</html>
