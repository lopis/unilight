<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Path Sketch Test</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(220px, 280px) 1fr;
      background: #f5f1ea;
      font-family: Georgia, serif;
    }

    aside {
      padding: 18px 16px;
      background: #e8dfd3;
      border-right: 1px solid #c6b7a0;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    p {
      margin: 0 0 14px;
      font-size: 13px;
      color: #4d4438;
    }

    .controls {
      display: grid;
      gap: 10px;
    }

    label {
      display: grid;
      gap: 4px;
      font-size: 13px;
      color: #2f2821;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    output {
      font-variant-numeric: tabular-nums;
      color: #66594a;
    }

    input {
      width: 100%;
    }

    main {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    canvas {
      width: 64px;
      height: 64px;
      image-rendering: crisp-edges;
    }

    @media (max-width: 700px) {
      body {
        grid-template-columns: 1fr;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid #c6b7a0;
      }
    }
  </style>
</head>
<body>
  <aside>
    <h1>Sketch Controls</h1>
    <p>Demo-only controls. The renderer below is separated into reusable platform code and test harness code.</p>
    <form class="controls" id="controls">
      <label>
        <span class="label-row"><span>Refresh Hz</span><output for="jitterHz" id="jitterHzOut"></output></span>
        <input id="jitterHz" name="jitterHz" type="range" min="1" max="8" step="1">
      </label>
      <label>
        <span class="label-row"><span>Stroke width</span><output for="strokeWidth" id="strokeWidthOut"></output></span>
        <input id="strokeWidth" name="strokeWidth" type="range" min="1" max="8" step="0.25">
      </label>
      <label>
        <span class="label-row"><span>Stroke amp</span><output for="strokeAmp" id="strokeAmpOut"></output></span>
        <input id="strokeAmp" name="strokeAmp" type="range" min="0" max="5" step="0.05">
      </label>
      <label>
        <span class="label-row"><span>Stroke samples</span><output for="strokeSamples" id="strokeSamplesOut"></output></span>
        <input id="strokeSamples" name="strokeSamples" type="range" min="24" max="140" step="1">
      </label>
      <label>
        <span class="label-row"><span>Cached frames</span><output for="frameCount" id="frameCountOut"></output></span>
        <input id="frameCount" name="frameCount" type="range" min="2" max="12" step="1">
      </label>
    </form>
  </aside>
  <main>
    <canvas id="c" width="280" height="128"></canvas>
  </main>

  <!-- One shared SVG helper for path metrics. Asset data lives in JS, not per-file SVG boilerplate. -->
  <svg id="metricsSvg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;left:-9999px;top:-9999px;overflow:hidden">
    <path id="metricsPath" d=""/>
  </svg>

  <script>
    const c = document.getElementById("c");
    const ctx = c.getContext("2d");
    const metricsPath = document.getElementById("metricsPath");
    const SPRITE_SIZE = 64;
    const SPRITE_PADDING = 4;
    const STROKE_COLOR = "#000";
    const RENDER_SCALE = 2;
    const DISPLAY_SIZE = 64;
    const PADDING = 8;
    const GAP = 12;

    // PLATFORM CODE: data-only sprite registry plus minimal path renderer.

      const sprites = {

          }
        ],
        banana: [
          {
            fill: "orange",
            d: "M 53.333324 0.52553317 C 50.276962 0.24498934 45.203499 2.103353 48.194811 5.7235354 C 49.703671 7.563798 48.653274 12.08856 52.020362 10.340538 C 55.750749 10.94128 55.703966 7.2342844 54.786137 4.6988125 C 54.200421 3.2675656 55.521996 0.81946756 53.333324 0.52553317 Z M 58.191362 11.64586 c 0.576419 4.696138 -0.8626 9.372496 -2.084565 13.864676 C 53.076832 35.738937 45.939815 44.888101 36.081572 49.28763 C 25.328343 54.192594 12.946894 54.708123 1.4786521 52.369053 C 1.3010814 54.03657 5.0491346 57.498202 7.1495783 58.955827 C 14.175696 64.105682 23.60263 64.48583 31.687287 61.911625 C 45.809022 57.722646 58.571348 46.963458 62.659245 32.493726 c 1.592318 -6.397252 1.298166 -13.83954 -2.997782 -19.172751 c -0.47728 -0.569401 -0.98011 -1.116729 -1.470101 -1.675115 z"
          },
          {
            fill: "gold",
            d: "M 6.9604297 53.972718 C 4.7397404 53.455209 1.0118628 54.094579 0.54713983 51.109624 C 0.18219036 48.082458 4.0168201 47.47322 6.2728906 47.325757 C 16.827485 46.323541 27.568297 44.036085 36.693558 38.410125 c 4.637631 -3.654416 8.525827 -8.378479 11.047324 -13.734453 c 1.966721 -4.325551 2.839808 -9.195731 2.142397 -13.917777 c 0.816435 -1.6993663 3.724794 -2.6629449 5.580148 -2.2128709 c 1.969723 1.7693029 3.721292 3.9557249 2.81684 6.7654199 c -1.064377 10.496894 -4.044335 21.456851 -11.640406 29.179649 c -4.458911 4.621099 -10.679343 7.045529 -16.963122 7.817272 c -7.506392 1.050919 -15.12525 1.999309 -22.7163093 1.665353 z"
          }
        ],
        blueberry: [
          {
            fill: "#2a599e",
            d: "m47.811 17.212a15.538 14.243 29.412 0 0-12.825 6.9303 15.538 14.243 29.412 0 0 6.5407 20.038 15.538 14.243 29.412 0 0 20.53-4.777 15.538 14.243 29.412 0 0-6.5407-20.038 15.538 14.243 29.412 0 0-7.705-2.1534z"
          },
          {
            fill: "#2a599e",
            d: "m21.807 17.342a17.723 19.335 51.179 0 0-13.906 4.5263 17.723 19.335 51.179 0 0-3.9527 25.929 17.723 19.335 51.179 0 0 26.174 1.6878 17.723 19.335 51.179 0 0 3.9532-25.929 17.723 19.335 51.179 0 0-12.269-6.2141z"
          },
          {
            fill: "#152c4f",
            d: "m18.077 24.178c-2.8416 0.97906-5.6562 2.0336-8.4858 3.0463 0.37521 3.14 0.75082 6.2801 1.126 9.4201 2.813 0.62181 5.6258 1.2437 8.4388 1.8655 1.6172-2.7747 3.2347-5.5494 4.8519-8.324-1.9114-1.9884-3.8226-3.9766-5.734-5.965l-0.11937-0.02635z"
          }
        ],
        peach: [
          {
            fill: "green",
            d: "m33.471 28.619c-3.0739-0.77669-2.5333-1.0132-5.1119-6.6448-2.223-4.8551-6.7299-6.4086-2.6484-10.552 3.4565-3.5091 6.8593 4.4176 8.04 6.4909 0 0-0.77941-6.154 5.335-11.725 6.1144-5.5715 17.41-5.6873 17.41-5.6873s-1.8729 10.382-8.0363 15.929c-6.1634 5.5472-13.427 4.146-13.427 4.146 2.276 5.0512 1.5128 8.82-1.5611 8.0433z",
          },
          {
            fill: "pink",
            d: "m19.06 21.533c-9.6638 2.0329-15.061 14.192-11.306 25.048 3.7547 10.856 24.259 16.919 24.259 16.919s20.503-6.0629 24.258-16.919c3.7547-10.856-1.8576-22.914-11.306-25.048s-12.951 2.6725-12.951 2.6725-3.2885-4.7054-12.952-2.6725z",
          },
        ],
        grape: [
          {
            fill: "green",
            d: "m17.434 0.50988c-3.7442-0.11618-7.7645 0.75336-8.8666 4.6968-2.2042 7.8869 2.6965 9.1436 3.1865 13.838 0.49004 4.6949 0.05619 11.455 0.05619 11.455s19.158-13.539 19.308-13.539-9.4353-0.38415-12.887-2.3514c-3.4513-1.9672-5.4499-4.9247-3.9638-7.7446 1.4861-2.8199 8.9083-0.079175 8.9083-0.079175l1.4703-5.0586s-3.4682-1.1012-7.2125-1.2174z",
          },
          {
            fill: "purple",
            d: "m32.041 15.735c-5.0426-4.2138-15.798 0.004448-12.309 8.275-7.3177-4.4185-15.023 3.6613-10.282 9.7248-7.6308 3.4529-5.0725 20.365 7.1367 15.194-1.4134 6.1001 7.4575 9.3955 12.831 6.4054-1.5498 7.0668 10.989 11.124 14.75 4.6381 4.7667 9.4796 20.558-2.3802 12.319-9.3936 1.8594-0.45062 6.2641-12.503-5.3847-13.643 3.2781-4.4271 0.28992-11.823-5.2612-12.459 9.3314-9.3716-11.016-19.307-13.799-8.7415z",
          }
        ],
        hand: [
          {
            fill: "gold",
            d: "m4.5089 7.5081c3.6469 7.9618 11.821 23.457 11.821 23.457-6.5197-4.6133-12.601-2.7591-13.243 0.91745-0.64203 3.6765 3.7773 3.7131 5.6776 5.3575 4.2236 2.7468 6.6579 7.3751 10.325 10.741 11.404 13.548 12.837 1.029 16.17 11.449s28.216-1.2961 25.514-11.301c-2.3034-8.529-5.6089-3.4923-6.9868-15.773-4.1725-20.199-15.883-13.969-30.446-10.267-3.357-6.6724-6.8239-12.935-11.1-19.095-4.8904-5.9736-10.054 0.09812-7.7308 4.5141z",
          }
        ],
      };

      function hash(i, pass, frame) {
        const n = Math.sin(i * 127.1 + pass * 311.7 + frame * 74.7) * 43758.5453;
        return (n - Math.floor(n)) * 2 - 1;
      }

      function pathNoise(i, pass, frame) {
        const r1 = hash(i, pass, frame);
        const r2 = hash(i + 29, pass + 7, frame + 1);
        return r1 * 0.7 + r2 * 0.3;
      }

      function samplePathData(d, count) {
        const out = [];
        metricsPath.setAttribute("d", d);
        const len = metricsPath.getTotalLength();
        const delta = len / count;

        for (let i = 0; i < count; i++) {
          const at = i * delta;
          const p = metricsPath.getPointAtLength(at);
          const prev = metricsPath.getPointAtLength((at - 1 + len) % len);
          const next = metricsPath.getPointAtLength((at + 1) % len);
          out.push({ x: p.x, y: p.y, tx: next.x - prev.x, ty: next.y - prev.y });
        }

        return out;
      }

      function buildSprite(name, sampleCount) {
        const source = sprites[name];
        return {
          name,
          layers: source.map((layer) => ({
            fill: layer.fill,
            path: new Path2D(layer.d),
            samples: samplePathData(layer.d, sampleCount)
          }))
        };
      }

      function drawSketchStroke(targetCtx, samples, frame, pass, color, width, amp) {
        const points = [];

        for (let i = 0; i < samples.length; i++) {
          const s = samples[i];
          const len = Math.hypot(s.tx, s.ty) || 1;
          const nx = -s.ty / len;
          const ny = s.tx / len;
          const n = (
            pathNoise(i - 2, pass, frame) +
            pathNoise(i - 1, pass, frame) * 2 +
            pathNoise(i, pass, frame) * 3 +
            pathNoise(i + 1, pass, frame) * 2 +
            pathNoise(i + 2, pass, frame)
          ) / 9;

          points.push({
            x: s.x + nx * n * amp,
            y: s.y + ny * n * amp
          });
        }

        targetCtx.beginPath();
        targetCtx.moveTo(points[0].x, points[0].y);

        for (let i = 0; i < points.length; i++) {
          const a = points[i];
          const b = points[(i + 1) % points.length];
          const mx = (a.x + b.x) * 0.5;
          const my = (a.y + b.y) * 0.5;
          targetCtx.quadraticCurveTo(a.x, a.y, mx, my);
        }

        targetCtx.closePath();
        targetCtx.lineJoin = "round";
        targetCtx.lineCap = "round";
        targetCtx.strokeStyle = color;
        targetCtx.lineWidth = width;
        targetCtx.stroke();
      }

      function drawSpriteToContext(targetCtx, sprite, frame, settings) {
        targetCtx.save();
        targetCtx.translate(SPRITE_PADDING * RENDER_SCALE, SPRITE_PADDING * RENDER_SCALE);
        targetCtx.scale(RENDER_SCALE, RENDER_SCALE);

        for (let i = 0; i < sprite.layers.length; i++) {
          const layer = sprite.layers[i];
          targetCtx.fillStyle = layer.fill;
          targetCtx.fill(layer.path);
          drawSketchStroke(targetCtx, layer.samples, frame, i, STROKE_COLOR, settings.strokeWidth, settings.strokeAmp);
        }

        targetCtx.restore();
      }

      function makeFrameCanvas(sprite, frame, settings) {
        const frameCanvas = document.createElement("canvas");
        frameCanvas.width = (SPRITE_SIZE + SPRITE_PADDING * 2) * RENDER_SCALE;
        frameCanvas.height = (SPRITE_SIZE + SPRITE_PADDING * 2) * RENDER_SCALE;
        const frameCtx = frameCanvas.getContext("2d");
        drawSpriteToContext(frameCtx, sprite, frame, settings);
        return frameCanvas;
      }

      function buildFrames(settings) {
        const names = Object.keys(sprites);
        return names.map((name) => {
          const sprite = buildSprite(name, settings.strokeSamples);
          const frames = [];
          for (let frame = 0; frame < settings.frameCount; frame++) {
            frames.push(makeFrameCanvas(sprite, frame, settings));
          }
          return { sprite, frames };
        });
      }

      return { sprites, buildFrames };
    })();

    // DEMO CODE: sidebar, cached frame preview, and animation loop.
    const controls = document.getElementById("controls");
    const state = {
      jitterHz: 3,
      strokeWidth: 4.0,
      strokeAmp: 2,
      strokeSamples: 100,
      frameCount: 5,
    };
    let spriteFrames = SketchSvgPlatform.buildFrames(state);

    function layoutCanvas() {
      const cols = spriteFrames.length;
      const tile = (SPRITE_SIZE + SPRITE_PADDING * 2) * RENDER_SCALE;
      const width = PADDING * 2 + cols * tile + Math.max(0, cols - 1) * GAP * RENDER_SCALE;
      const height = PADDING * 2 + tile;
      c.width = width;
      c.height = height;
      c.style.width = `${width / RENDER_SCALE}px`;
      c.style.height = `${height / RENDER_SCALE}px`;
    }

    function rebuildFrames() {
      spriteFrames = SketchSvgPlatform.buildFrames(state);
      layoutCanvas();
    }

    function syncControls() {
      for (const [key, value] of Object.entries(state)) {
        const input = document.getElementById(key);
        if (!input) continue;
        input.value = String(value);
        const output = document.getElementById(key + "Out");
        if (!output) continue;
        output.value = Number.isInteger(value) ? String(value) : value.toFixed(2);
      }
    }

    controls.addEventListener("input", (event) => {
      const target = event.target;
      if (!(target instanceof HTMLInputElement)) return;

      const key = target.name;
      const next = target.step === "1" ? Number(target.value) : parseFloat(target.value);
      state[key] = next;

      const output = document.getElementById(key + "Out");
      if (output) output.value = target.step === "1" ? String(next) : next.toFixed(2);

      if (key === "strokeSamples" || key === "frameCount" || key === "strokeWidth" || key === "strokeAmp") {
        rebuildFrames();
      }
    });

    syncControls();
    layoutCanvas();

    function drawFrameSet(frameIndex) {
      const tile = (SPRITE_SIZE + SPRITE_PADDING * 2) * RENDER_SCALE;
      const gap = GAP * RENDER_SCALE;

      for (let i = 0; i < spriteFrames.length; i++) {
        const entry = spriteFrames[i];
        const x = PADDING + i * (tile + gap);
        const frame = entry.frames[frameIndex % entry.frames.length];
        ctx.drawImage(frame, x, PADDING);
      }
    }

    function frame(nowMs) {
      const jitterFrame = Math.floor(nowMs / (1000 / state.jitterHz));

      ctx.clearRect(0, 0, c.width, c.height);
      drawFrameSet(jitterFrame);

      requestAnimationFrame(frame);
    }

    frame(0);
  </script>
</body>
</html>
