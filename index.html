<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>JS13K TS</title>
    <link rel="stylesheet" href="style.css"/>
    <link rel="shortcut icon" type="image/x-icon">
</head>
<html lang="en">
<body>
    <div id="debug" style="
        position: fixed;
        top: 60px;
        left: 0;
        color: white;
        padding: 1vh;
        font-size: 10px;
        z-index: 1;">
        <!-- <span id="fps"></span> -->
        <span id="coords"></span>
    </div>
    <svg id="ms" aria-hidden="true" focusable="false">
      <path id="mp" d=""></path>
    </svg>
    <main>
      <section id="menu">
        <h1 class="big"><span>Unilight</span> <em>DASH</em></h1>
        <button id="newGame">New Game</button>
      </section>
      <section id="game">
        <div id="crystals"></div>
        <div class="grid-wrapper">
          <div id="gameGrid">
            <canvas id="c4" width="960" height="540"></canvas>
            <i id="unicorn"><span class="unicorn-core"></span><span class="unicorn-orbit"></span></i>
          </div>
        </div>
        <div id="inventory">
          <i class="FR hide" data-i="FR"></i>
          <i class="FO hide" data-i="FO"></i>
          <i class="FY hide" data-i="FY"></i>
          <i class="FG hide" data-i="FG"></i>
          <i class="FC hide" data-i="FC"></i>
          <i class="FB hide" data-i="FB"></i>
          <i class="FV hide" data-i="FV"></i>
          <i class="GR hide" data-i="GR"></i>
          <i class="GO hide" data-i="GO"></i>
          <i class="GY hide" data-i="GY"></i>
          <i class="GG hide" data-i="GG"></i>
          <i class="GC hide" data-i="GC"></i>
          <i class="GB hide" data-i="GB"></i>
          <i class="GV hide" data-i="GV"></i>
        </div>
        <div id="tools">
          <div id="workarea">
            <div id="space1"><i></i></div>
            <div id="space2"><i></i></div>
            <div id="space3"><i></i></div>
          </div>
          <div id="spells">
            <button id="add"></button>
            <button id="sub"></button>
            <button id="com"></button>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/index.ts"></script>
</body>
</html>
