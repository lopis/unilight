<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>JS13K TS</title>
    <link rel="stylesheet" href="style.css"/>
    <link rel="shortcut icon" type="image/x-icon">
</head>
<html lang="en">
<body>
    <div id="debug" style="
        position: fixed;
        top: 60px;
        left: 0;
        color: white;
        padding: 1vh;
        font-size: 10px;
        z-index: 1;">
        <!-- <span id="fps"></span> -->
        <span id="coords"></span>
    </div>
    <svg id="ms" aria-hidden="true" focusable="false">
      <path id="mp" d=""></path>
    </svg>
    <main>
      <section id="menu">
        <h1 class="big"><span>Unilight</span> <em>DASH</em></h1>
        <button id="newGame">New Game</button>
      </section>
      <section id="game">
        <h1><span>Unilight</span> <em>DASH</em></h1>
        <div class="grid-wrapper">
          <div id="gameGrid">
            <canvas id="c4" width="960" height="540"></canvas>
          </div>
        </div>
        <div id="inventory">
          <i class="peach hide"></i>
          <i class="strawberry hide"></i>
          <i class="banana hide"></i>
          <i class="hand hide"></i>
          <i class="water hide"></i>
          <i class="blueberry hide"></i>
          <i class="grape hide"></i>
        </div>
        <div id="tools">
          <div id="workarea">
            <div id="space1"><i></i></div>
            <div id="space2"><i></i></div>
            <div id="space3"><i></i></div>
          </div>
          <div id="spells">
            <button id="add"></button>
            <button id="sub"></button>
            <button id="com"></button>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/index.ts"></script>
</body>
</html>
