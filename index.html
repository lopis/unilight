<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>JS13K TS</title>
    <link rel="stylesheet" href="style.css"/>
    <link rel="shortcut icon" type="image/x-icon">
</head>
<html lang="en">
<body>
    <div id="debug" style="
        position: fixed;
        top: 60px;
        left: 0;
        color: white;
        padding: 1vh;
        font-size: 10px;
        z-index: 1;">
        <!-- <span id="fps"></span> -->
        <span id="coords"></span>
    </div>
    <section id="menu">
      <button id="newGame">New Game</button>
    </section>
    <section id="game">
      <canvas id="c4" width="960" height="540"></canvas>
      <div id="gameGrid"></div>
      <div id="inventory"></div>
      <div id="tools">
        <div id="spells">
          <div>Spells</div>
          <label><input type="radio" name="spell" id="add">Add</label>
          <label><input type="radio" name="spell" id="sub">Sub</label>
          <label><input type="radio" name="spell" id="com">Com</label>
        </div>
        <div id="workarea">
          <div id="space1"></div>
          <div id="space2"></div>
          <div id="space3"></div>
        </div>
      </div>
    </section>
    <script type="module" src="/src/index.ts"></script>
</body>
</html>
